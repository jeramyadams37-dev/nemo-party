<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Ilah Hugh Reed's Nemo Party</title>
<style>
body{margin:0;font-family:system-ui;background:linear-gradient(#37b6ff,#0a4d8c);color:#fff;min-height:100vh;text-align:center}
h1{margin:14px 8px 4px}nav{display:flex;gap:6px;justify-content:center;padding:8px;flex-wrap:wrap}
button{background:#ff8a1f;color:#fff;border:0;border-radius:20px;padding:10px 16px;font-size:16px}
section{display:none;padding:10px}section.on{display:block}
.g{columns:2;gap:8px}.g img{width:100%;margin-bottom:8px;border-radius:12px}
#sea{position:relative;height:60vh;background:#0006;border-radius:16px;overflow:hidden}
.bub{position:absolute;bottom:-60px;font-size:46px;animation:r 6s linear forwards}
@keyframes r{to{transform:translateY(-75vh)}}
.m{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:auto}
.c{aspect-ratio:1;background:#ff8a1f;border-radius:12px;font-size:36px;display:flex;align-items:center;justify-content:center}
.c.f{background:#fff}
textarea,input{width:90%;max-width:400px;padding:10px;border-radius:10px;border:0;font-size:16px;margin:4px}
.msg{background:#fff3;border-radius:12px;margin:8px auto;padding:8px;max-width:400px}
</style></head><body>
<h1 style="padding:0 80px">🐠 In TWO the Sea! 🐠</h1><div>A Fin-tastic Celebration for ILAH!</div>
<script>/*sp*/
(()=>{const C='<svg width="64" height="40" viewBox="0 0 64 40"><path d="M8 20 L0 8 L0 32Z" fill="#ff7a00" stroke="#000" stroke-width="1.5"/><ellipse cx="36" cy="20" rx="26" ry="15" fill="#ff7a00" stroke="#000" stroke-width="1.5"/><path d="M26 5.5 Q22 20 26 34.5 L31 33.5 Q27 20 31 6.5Z" fill="#fff"/><path d="M46 7 Q44 20 46 33 L51 31 Q49 20 51 9Z" fill="#fff"/><circle cx="54" cy="16" r="3" fill="#fff"/><circle cx="55" cy="16" r="1.5" fill="#000"/></svg>',T='<svg width="64" height="40" viewBox="0 0 64 40"><path d="M10 20 L0 6 L0 34Z" fill="#ffd400" stroke="#000" stroke-width="1.5"/><ellipse cx="36" cy="20" rx="26" ry="15" fill="#2563eb" stroke="#0a2a66" stroke-width="1.5"/><path d="M18 20 Q30 10 44 14 Q32 18 36 26 Q24 28 18 20Z" fill="#0b1b4d"/><circle cx="54" cy="16" r="3" fill="#fff"/><circle cx="55" cy="16" r="1.5" fill="#000"/></svg>';
[C,T,C,T,C,T,C].forEach((s,i)=>{const d=document.createElement("div");d.className="fish";d.innerHTML=s;d.style.top=(12+i*12)+"%";d.style.animationDuration=(14+i*3)+"s";d.style.animationDelay="-"+(i*4)+"s";document.body.appendChild(d)})})();
</script>
<style>
.fish{position:fixed;font-size:34px;pointer-events:none;z-index:0;animation:swm linear infinite}
@keyframes swm{from{transform:translateX(-80px)}to{transform:translateX(110vw)}}
.sw{position:fixed;bottom:0;left:0;right:0;font-size:38px;pointer-events:none;z-index:0;white-space:nowrap;overflow:hidden;opacity:.85}
#mu{position:fixed;top:8px;right:8px;z-index:9}
h1,nav,section{position:relative;z-index:1}
</style>
<script>
(()=>{const E=["🐠","🐟","🐡","🐢","🦈","🐬","🦀","🐙"];
E.forEach((e,i)=>{const d=document.createElement("div");d.className="fish";d.textContent=e;d.style.top=(8+i*11)+"%";d.style.animationDuration=(18+i*4)+"s";d.style.animationDelay="-"+(i*5)+"s";document.body.appendChild(d)});
const w=document.createElement("div");w.className="sw";w.textContent="🌿🪸🌿🐚🌿⭐🌿🪸🌿🐚🌿⭐🌿🪸🌿🐚🌿";document.body.appendChild(w);
const b=document.createElement("button");b.id="mu";b.textContent="🎵 Music";document.body.appendChild(b);
let C,on=0,tm,k=0;const N=[392,440,523,587,659,784],M=[0,2,4,2,3,1,0,1,2,4,3,2,1,0,1,0];
function note(f,t,d,v){const o=C.createOscillator(),g=C.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(C.destination);o.start(t);o.stop(t+d)}
function step(){const t=C.currentTime,f=N[M[k%16]];note(f,t,1.6,.12);if(k%4==0)note(f/2,t,3,.08);k++}
const A=new Audio('song.mp3');A.loop=true;b.onclick=()=>{const f=document.getElementById('yt');if(f)f.remove();if(on){A.pause();on=0;b.textContent='🎵 Music'}else{A.play();on=1;b.textContent='🔇 Stop'}}
})();
</script>
<nav><button onclick=show(0)>📸 Photos</button><button onclick=show(1)>🫧 Pop</button><button onclick=show(2)>🐙 Match</button><button onclick=show(3)>💌 Guestbook</button><button onclick=show(4)>🎈 Info</button></nav>
<section class=on><div class=g id=g></div></section>
<section><h2>Score: <span id=sc>0</span></h2><div id=sea></div></section>
<section><h2>Find the pairs!</h2><div class=m id=m></div><p><button onclick=mk()>New game</button></p></section>
<section><input id=gn placeholder="Your name"><br><textarea id=gm rows=3 placeholder="Leave a message"></textarea><br><button onclick=post()>Send 💙</button><div id=gl></div></section>
<section><h2>You're invited! 🎈</h2><p style="font-size:20px">Ilah's 2nd Birthday<br>Sunday, November 8th · 2:00 PM<br><a style="color:#fff" href="https://maps.google.com/?q=330+W+Adams+St+Greenview+IL">📍 330 W Adams St, Greenview IL</a></p><a href="tel:2173615057"><button>📞 RSVP: 217-361-5057</button></a></section>
<script>
const P=["photos/p1.jpg","photos/p2.jpg","photos/p3.jpg","photos/p4.jpg","photos/p5.jpg","photos/p6.jpg","photos/p7.jpg","photos/p8.jpg","photos/p9.jpg","photos/p10.jpg","photos/p11.jpg","photos/p12.jpg","photos/p13.jpg","photos/p14.jpg","photos/p15.jpg","photos/p16.jpg","photos/p17.jpg","photos/p18.jpg"],B="",U="https://jsonblob.com/api/jsonBlob/"+B,H={"Content-Type":"application/json","Accept":"application/json"};
const S=document.querySelectorAll("section");let t;
function show(n){S.forEach((s,i)=>s.classList.toggle("on",i==n));clearInterval(t);if(n==1)t=setInterval(bub,700);if(n==2)mk();if(n==3)load()}
g.innerHTML=P.map(p=>`<img loading=lazy src="${p}">`).join("");
let sc0=0;function bub(){const b=document.createElement("div");b.className="bub";b.textContent=["🫧","🐠","🐟","🫧"][Math.random()*4|0];b.style.left=Math.random()*80+"%";b.onpointerdown=()=>{sc.textContent=++sc0;b.remove()};b.onanimationend=()=>b.remove();sea.appendChild(b)}
let a=[],lock=0;function mk(){const e=["🐠","🐢","🦈","🐙","🦀","🐡","🐬","🐳"];const d=[...e,...e].sort(()=>Math.random()-.5);m.innerHTML="";a=[];d.forEach(x=>{const c=document.createElement("div");c.className="c";c.textContent="❓";c.onclick=()=>{if(lock||c.classList.contains("f")||a.includes(c))return;c.textContent=x;c.classList.add("f");a.push(c);if(a.length==2){lock=1;const[p,q]=a;if(p.textContent==q.textContent){a=[];lock=0}else setTimeout(()=>{[p,q].forEach(z=>{z.textContent="❓";z.classList.remove("f")});a=[];lock=0},800)}};m.appendChild(c)})}
async function load(){try{const r=await(await fetch(U,{headers:H})).json();gl.innerHTML=r.reverse().map(x=>`<div class=msg><b>${x.n}</b><br>${x.t}</div>`).join("")}catch(e){gl.textContent="Couldn't load messages"}}
async function post(){const n=gn.value.trim()||"Guest",t=gm.value.trim().replace(/</g,"&lt;");if(!t)return;try{const r=await(await fetch(U,{headers:H})).json();r.push({n:n.replace(/</g,"&lt;"),t});await fetch(U,{method:"PUT",headers:H,body:JSON.stringify(r)});gm.value="";load()}catch(e){alert("Try again")}}
</script></body></html>
